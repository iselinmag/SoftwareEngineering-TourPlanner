<div class="auth-page">
  <div class="auth-card">
    <h1>Create an account</h1>
    <p class="auth-subtitle">Sign up to start planning tours</p>

    <label>Username</label>
    <input type="text" [(ngModel)]="username" placeholder="pick a username" />

    <label>Password</label>
    <input type="password" [(ngModel)]="password" placeholder="pick a password" />

    <button (click)="submit()">Register</button>

    <p class="auth-switch">
      Already have an account? <a routerLink="/login">Log in here</a>
    </p>
  </div>
</div>
